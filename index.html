<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B35">
<title>Mahly · Mein Review</title>
<style>
:root {
  --o:#FF6B35; --o-soft:#FFE9DD; --bg:#FFF8F0; --ink:#1A1A1A;
  --mute:#7a6f5c; --line:#EFE6D6; --card:#fff;
  --green:#2D6A4F; --green-soft:#dff7e6;
  --red:#a82828; --red-soft:#fde0e0;
  --orange:#9a6a1a; --orange-soft:#fbe6c9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 6px rgba(80,60,30,.06)}
.top-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;flex:1;min-width:0}
.brand small{color:var(--mute);font-weight:500;margin-left:4px;font-size:12px}
.stat{font-size:12px;color:#555;padding:4px 9px;background:var(--bg);border-radius:8px;white-space:nowrap}
.stat strong{color:var(--o)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controls>*{width:100%}
select,input[type=search]{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;font-family:inherit;min-height:38px}
input[type=search]{grid-column:1/-1}
button{padding:9px 14px;border:1px solid var(--o);background:var(--o);color:#fff;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px;font-family:inherit}
button.ghost{background:#fff;color:var(--o)}
button:active{transform:scale(0.97)}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 12px 80px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:14px;padding:16px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1300px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:700px){.top{padding:12px 22px;flex-direction:row;flex-wrap:wrap;align-items:center}.controls{display:contents}select,input[type=search],button{width:auto;min-height:36px}input[type=search]{grid-column:auto;min-width:220px;flex:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(80,60,30,.05)}
.card.reviewed{border-color:var(--o);box-shadow:0 1px 4px rgba(255,107,53,.18)}
.thumb{width:100%;aspect-ratio:1/1;background:#f6efe1;display:flex;align-items:center;justify-content:center;position:relative;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{color:#bbb;font-size:13px}
.ai-badge{position:absolute;top:9px;right:9px;padding:4px 10px;border-radius:8px;font-weight:700;font-size:12px;backdrop-filter:blur(8px);background:rgba(255,255,255,.85);pointer-events:none}
.b-good{color:var(--green)}.b-mid{color:var(--orange)}.b-low{color:var(--red)}.b-none{color:#777}
.meta{padding:13px 14px 14px}
.title{font-weight:700;font-size:15px;line-height:1.35;min-height:41px}
.sub{font-size:12px;color:var(--mute);margin-top:4px}
.sub .diet-vegan{color:var(--green);font-weight:700}
.sub .diet-vegetarian{color:var(--green)}
.ingred{margin-top:10px;font-size:12px;color:#555;line-height:1.5;max-height:66px;overflow:hidden;position:relative;transition:max-height .2s}
.ingred.open{max-height:800px}
.ingred::after{content:'';position:absolute;bottom:0;left:0;right:0;height:22px;background:linear-gradient(180deg,transparent,var(--card))}
.ingred.open::after{display:none}
.ingred-toggle{margin-top:5px;font-size:12px;color:var(--o);cursor:pointer;user-select:none;padding:4px 0;font-weight:600}
.review{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.score-row label{font-size:13px;color:var(--mute);min-width:92px;font-weight:600}
.score-input{width:78px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:15px;text-align:center;font-family:inherit;min-height:40px}
.score-input.has{border-color:var(--o);background:var(--o-soft);color:var(--o)}
.comment{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;resize:vertical;min-height:60px;font-family:inherit}
.comment.has{border-color:var(--o);background:#fffaf6}
.saved-tick{font-size:12px;color:var(--green);margin-left:auto;opacity:0;transition:opacity .3s}
.saved-tick.show{opacity:1}
footer{text-align:center;padding:30px 20px 40px;color:var(--mute);font-size:13px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox-close{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:300;backdrop-filter:blur(8px)}
.lightbox-info{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:13px;padding:0 20px;text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}
.lightbox-info b{color:#fff;font-weight:700;display:block;font-size:15px;margin-bottom:4px}
#errBanner{display:none;background:#fde0e0;color:#a82828;padding:14px 18px;font-size:14px;border-radius:8px;margin:14px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
#errBanner.show{display:block}

.loadlbl{padding:9px 14px;border:1px solid var(--o);background:#fff;color:var(--o);border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;justify-content:center}
.loadlbl:active{transform:scale(0.97)}
@media(min-width:700px){.loadlbl{min-height:36px}}
</style>
</head>

<div class="top">
  <div class="top-row">
    <div class="brand">Mahly <small>Mein Review</small></div>
    <span class="stat" id="cnt">lade …</span>
  </div>
  <div class="controls">
    <select id="filterShow">
      <option value="all">alle anzeigen</option>
      <option value="unreviewed">nur unbewertete</option>
      <option value="reviewed">nur bewertete</option>
      <option value="low-ai">nur AI &lt; 8,0</option>
    </select>
    <select id="filterCuisine"><option value="">alle Cuisines</option></select>
    <input id="search" type="search" placeholder="Suche Titel / Zutat …">
    <button id="exportBtn">CSV exportieren</button>
    <button id="backupBtn" class="ghost">Backup speichern</button>
    <label for="loadInput" class="loadlbl">Backup laden</label>
    <input type="file" id="loadInput" accept=".json" style="display:none">
    <button id="clearBtn" class="ghost">Bewertungen löschen</button>
  </div>
</div>

<div id="errBanner"></div>
<div class="grid" id="grid"></div>

<footer>
  Bewertungen werden automatisch im Browser gespeichert (localStorage) — auch nach Browser-Schliessen wieder da.<br>
  Fuer extra Sicherheit: <b>Backup speichern</b> erstellt eine .json-Datei zum lokalen Sichern.<br>
  Auf einem neuen Geraet: <b>Backup laden</b> stellt alles wieder her.
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose" aria-label="Schliessen">×</button>
  <img id="lbImg" alt="">
  <div class="lightbox-info" id="lbInfo"></div>
</div>

<script>
window.addEventListener('error', function(e){
  var b = document.getElementById('errBanner');
  if (b) {
    b.classList.add('show');
    b.textContent = 'JS-Fehler: ' + e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?');
  }
});

var STORAGE_KEY = 'mahly-tim-review-v1';
var grid = document.getElementById('grid');
var cnt = document.getElementById('cnt');
var filterShow = document.getElementById('filterShow');
var filterCuisine = document.getElementById('filterCuisine');
var search = document.getElementById('search');
var lightbox = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbInfo = document.getElementById('lbInfo');
var lbClose = document.getElementById('lbClose');

var cuisines = Array.from(new Set(DATA.map(function(d){return d.cuisine}))).sort();
for (var i = 0; i < cuisines.length; i++) {
  var o = document.createElement('option');
  o.value = cuisines[i]; o.textContent = cuisines[i];
  filterCuisine.appendChild(o);
}

function loadReviews() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveReviews(r) { localStorage.setItem(STORAGE_KEY, JSON.stringify(r)); }
function badgeClass(s) {
  if (s == null) return 'b-none';
  if (s >= 8.5) return 'b-good';
  if (s >= 8.0) return 'b-mid';
  return 'b-low';
}
function fmtScore(s) { return s == null ? '—' : Number(s).toFixed(1).replace('.', ','); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function openLightbox(slug) {
  var d = null;
  for (var k = 0; k < DATA.length; k++) { if (DATA[k].slug === slug) { d = DATA[k]; break; } }
  if (!d || !d.img_url) return;
  lbImg.src = d.img_url;
  lbInfo.innerHTML = '<b>' + esc(d.title) + '</b>' + esc(d.cuisine + ' · ' + d.difficulty + ' · ' + d.diet_type);
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  lbImg.src = '';
  document.body.style.overflow = '';
}
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', function(e){ if (e.target === lightbox || e.target === lbImg) closeLightbox(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLightbox(); });

function render() {
  var reviews = loadReviews();
  var show = filterShow.value, cuisine = filterCuisine.value;
  var q = search.value.toLowerCase().trim();
  var total = 0, shown = 0, reviewed = 0;
  grid.innerHTML = '';
  for (var n = 0; n < DATA.length; n++) {
    var d = DATA[n];
    total++;
    var r = reviews[d.slug] || {};
    var hasReview = (r.score != null && r.score !== '') || (r.comment && r.comment.trim());
    if (hasReview) reviewed++;
    if (show === 'unreviewed' && hasReview) continue;
    if (show === 'reviewed' && !hasReview) continue;
    if (show === 'low-ai' && (d.score == null || Number(d.score) >= 8.0)) continue;
    if (cuisine && d.cuisine !== cuisine) continue;
    if (q) {
      var hay = (d.title + ' ' + d.slug + ' ' + (d.ingredients || []).join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) continue;
    }
    shown++;
    var card = document.createElement('div');
    card.className = 'card' + (hasReview ? ' reviewed' : '');
    var html = '';
    html += '<div class="thumb" data-zoom="' + esc(d.slug) + '">';
    html += d.img_url ? '<img loading="lazy" src="' + esc(d.img_url) + '" alt="">' : '<div class="noimg">kein Bild</div>';
    html += '<span class="ai-badge ' + badgeClass(d.score) + '">' + fmtScore(d.score) + '</span>';
    html += '</div>';
    html += '<div class="meta">';
    html += '<div class="title">' + esc(d.title) + '</div>';
    html += '<div class="sub">' + esc(d.cuisine) + ' · ' + esc(d.difficulty) + ' · <span class="diet-' + d.diet_type + '">' + esc(d.diet_type) + '</span></div>';
    html += '<div class="ingred" id="ing-' + d.slug + '">' + (d.ingredients || []).map(esc).join('<br>') + '</div>';
    if (d.ingredients && d.ingredients.length > 6) {
      html += '<div class="ingred-toggle" data-slug="' + d.slug + '">alle Zutaten zeigen</div>';
    }
    html += '<div class="review">';
    html += '<div class="score-row">';
    html += '<label for="s-' + d.slug + '">Mein Score:</label>';
    html += '<input id="s-' + d.slug + '" data-slug="' + d.slug + '" data-field="score" class="score-input' + (r.score ? ' has' : '') + '" type="number" inputmode="decimal" min="1" max="10" step="0.5" placeholder="1-10" value="' + (r.score == null ? '' : r.score) + '">';
    html += '<span class="saved-tick" id="t-' + d.slug + '">gespeichert</span>';
    html += '</div>';
    html += '<textarea data-slug="' + d.slug + '" data-field="comment" class="comment' + (r.comment ? ' has' : '') + '" placeholder="Kommentar - was passt, was fehlt, was ist komisch ...">' + esc(r.comment || '') + '</textarea>';
    html += '</div></div>';
    card.innerHTML = html;
    grid.appendChild(card);
  }
  cnt.innerHTML = '<strong>' + shown + '</strong> / ' + total + ' sichtbar - <strong>' + reviewed + '</strong> bewertet';
}

grid.addEventListener('click', function(e) {
  var zoomEl = e.target.closest('[data-zoom]');
  if (zoomEl) { openLightbox(zoomEl.dataset.zoom); return; }
  if (e.target.classList.contains('ingred-toggle')) {
    var slug = e.target.dataset.slug;
    var ing = document.getElementById('ing-' + slug);
    ing.classList.toggle('open');
    e.target.textContent = ing.classList.contains('open') ? 'weniger zeigen' : 'alle Zutaten zeigen';
  }
});

grid.addEventListener('input', function(e) {
  var t = e.target;
  if (!t.dataset.slug) return;
  var slug = t.dataset.slug, field = t.dataset.field;
  var reviews = loadReviews();
  reviews[slug] = reviews[slug] || {};
  reviews[slug][field] = field === 'score' ? (t.value === '' ? null : parseFloat(t.value)) : t.value;
  if (!reviews[slug].score && !reviews[slug].comment) delete reviews[slug];
  saveReviews(reviews);
  if (field === 'score') t.classList.toggle('has', t.value !== '');
  if (field === 'comment') t.classList.toggle('has', t.value.trim() !== '');
  var tick = document.getElementById('t-' + slug);
  if (tick) {
    tick.classList.add('show');
    clearTimeout(tick._to);
    tick._to = setTimeout(function(){ tick.classList.remove('show'); }, 900);
  }
  var card = t.closest('.card');
  card.classList.toggle('reviewed', !!reviews[slug]);
  var totalReviewed = Object.keys(reviews).length;
  cnt.innerHTML = cnt.innerHTML.replace(/(<strong>)\d+(<\/strong> bewertet)/, '$1' + totalReviewed + '$2');
});

filterShow.addEventListener('input', render);
filterCuisine.addEventListener('input', render);
search.addEventListener('input', render);

document.getElementById('exportBtn').addEventListener('click', function() {
  var reviews = loadReviews();
  var sep = String.fromCharCode(59);
  var nl = String.fromCharCode(10);
  var lines = ['slug;title;cuisine;diet_type;ai_score;tim_score;tim_comment'];
  for (var n = 0; n < DATA.length; n++) {
    var d = DATA[n];
    var r = reviews[d.slug] || {};
    if (!r.score && !r.comment) continue;
    var row = [d.slug, d.title, d.cuisine, d.diet_type,
               d.score == null ? '' : d.score,
               r.score == null ? '' : r.score,
               (r.comment || '').replace(/[;\n]+/g, ' ').trim()];
    var quoted = [];
    for (var j = 0; j < row.length; j++) { quoted.push('"' + String(row[j]).replace(/"/g, '""') + '"'); }
    lines.push(quoted.join(sep));
  }
  var blob = new Blob([lines.join(nl)], {type: 'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'mahly-review-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('clearBtn').addEventListener('click', function() {
  if (confirm('Wirklich ALLE eigenen Bewertungen löschen?')) {
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
});


document.getElementById('backupBtn').addEventListener('click', function() {
  var reviews = loadReviews();
  var n = Object.keys(reviews).length;
  if (n === 0) { alert('Noch keine Bewertungen vorhanden.'); return; }
  var blob = new Blob([JSON.stringify(reviews, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'mahly-bewertungen-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  alert('Backup mit ' + n + ' Bewertungen gespeichert. Datei landet im Downloads-Ordner.');
});

document.getElementById('loadInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      var current = loadReviews();
      var newCount = 0, mergedCount = 0;
      for (var k in data) {
        if (data.hasOwnProperty(k)) {
          if (!current[k]) newCount++; else mergedCount++;
          current[k] = data[k];
        }
      }
      saveReviews(current);
      alert('Backup geladen. ' + newCount + ' neue + ' + mergedCount + ' aktualisierte Bewertungen.');
      render();
    } catch (err) {
      alert('Fehler beim Laden: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // damit dieselbe Datei nochmal geladen werden kann
});

render();

} catch (err) {
  var b = document.getElementById('errBanner');
  if (b) {
    b.classList.add('show');
    b.textContent = 'JS-Crash: ' + err.message + (err.stack ? '\n\n' + err.stack.substring(0, 500) : '');
  }
}
</script>
</body>
</html>
